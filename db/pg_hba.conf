# pg_hba.conf - controle de acesso do Postgres (primeira linha que casa vence)
#
# Montado em /etc/postgresql/pg_hba.conf (read-only) pelo docker-compose.
# A porta 5432 NAO e publicada no host, entao o unico caminho ate aqui e a
# rede interna do compose. Mesmo assim, é exigido a senha com scram-sha-256.

# TYPE   DATABASE     USER    ADDRESS      METHOD

# Socket unix dentro do container, usado pelo healthcheck e por psql manual
local    all          all                  scram-sha-256

# Containers da mesma rede docker. "samenet" = sub-redes das
# interfaces do proprio container, nao incluindo a internet
host     all          all     samenet      scram-sha-256

# Loopback do container
host     all          all     127.0.0.1/32 scram-sha-256
host     all          all     ::1/128      scram-sha-256

# Replicacao não é usada no projeto
local    replication  all                  reject
host     replication  all     all          reject

# Qualquer outra origem é negada explicitamente
host     all          all     0.0.0.0/0    reject
host     all          all     ::/0         reject
